[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recertagent"
version = "0.2.0"
description = "Attack-blind safety certification for remediated stateful LLM agents"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45",
  "datasets>=3.2,<5",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0",
  "sentence-transformers>=3.3,<6",
  "torch>=2.4",
  "tqdm>=4.67",
  "transformers>=4.47,<5",
  "agentdojo==0.1.35"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
recertagent = "recertagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
